name: One-shot Stage 011 compile cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-stage011-compile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply compile cleanup
        run: python3 .github/patch_stage011_compile.py

      - name: Commit directly to main
        run: |
          git config user.name "NyerahMT"
          git config user.email "68287092+NyerahMT@users.noreply.github.com"
          git rm .github/patch_stage011_compile.py .github/workflows/one-shot-stage011-compile.yml
          git add Aircraft/PrototypeAircraftFactory.swift App/PrototypeSceneView.swift
          git diff --cached --check
          git commit -m "Stage 011.2: fix exhaust and audio compile types"
          git push origin HEAD:main

name: Stage022 Project Wire

on:
  push:
    branches:
      - stage022-main-menu-attract-mode
    paths:
      - '.github/workflows/stage022-project-wire.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage022-main-menu-attract-mode

      - name: Wire Stage 022 Swift sources into Xcode project
        run: python3 scripts/stage022_project_patch.py

      - name: Verify source membership
        run: |
          set -euo pipefail
          grep -q 'Stage022RootView.swift in Sources' FullAuthority.xcodeproj/project.pbxproj
          grep -q 'Stage022MainMenu.swift in Sources' FullAuthority.xcodeproj/project.pbxproj
          git diff --check

      - name: Commit Xcode project update
        run: |
          set -euo pipefail
          git config user.name 'NyerahMT'
          git config user.email '68287092+NyerahMT@users.noreply.github.com'
          git add FullAuthority.xcodeproj/project.pbxproj
          git commit -m 'Stage 022: wire menu sources into Xcode project'
          git push origin HEAD:stage022-main-menu-attract-mode

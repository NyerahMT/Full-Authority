name: One-shot Stage 012 F-16 HUD

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-stage012-f16-hud.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply F-16 HUD patch
        run: python3 scripts/stage012_patch.py

      - name: Commit directly to main
        run: |
          set -euo pipefail
          rm -f scripts/stage012_patch.py .github/workflows/one-shot-stage012-f16-hud.yml
          git config user.name "NyerahMT"
          git config user.email "68287092+NyerahMT@users.noreply.github.com"
          git add -A
          git commit -m "Stage 012: full-fidelity F-16 NAV HUD and HMD toggle"
          git push origin main

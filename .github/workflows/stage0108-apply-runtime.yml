name: Stage 010.8 apply authored F-16 runtime

on:
  push:
    branches: [stage-010-8-authored-f16-audio]
    paths:
      - Scripts/apply_stage0108_runtime.py
      - .github/workflows/stage0108-apply-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage-010-8-authored-f16-audio
          fetch-depth: 0
      - name: Apply runtime changes
        run: python3 Scripts/apply_stage0108_runtime.py
      - name: Verify authored assets are bundled
        run: |
          test -f Assets/JSBSim/visuals/f16/f16_static.obj
          test -f Assets/JSBSim/visuals/f16/left_flaperon.obj
          test -f Assets/JSBSim/visuals/f16/right_flaperon.obj
          test -f Assets/JSBSim/visuals/f16/afterburner_plume.obj
      - name: Commit runtime implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Aircraft/PrototypeAircraftFactory.swift Simulation/AircraftState.swift Simulation/FlightSimulation.swift App/PrototypeSceneView.swift
          git diff --cached --quiet || git commit -m "Replace F-16 visuals and add engine-state audio"
          git pull --rebase origin stage-010-8-authored-f16-audio
          git push origin HEAD:stage-010-8-authored-f16-audio

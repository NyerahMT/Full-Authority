name: Stage024 inspect Helsinki tile
on:
  push:
    branches: [stage024-real-reno-map]
    paths: ['.github/workflows/tmp-stage024-inspect-helsinki.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Inspect Malmi official reality-mesh tile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet remotezip pillow
          python3 - <<'PY'
          import io, urllib3
          from remotezip import RemoteZip
          from PIL import Image
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          url='https://3d.hel.ninja/data/mesh/Helsinki3D-MESH_2017_OBJ_2km-250m_ZIP/Helsinki3D_2017_OBJ_682502x2.zip'
          with RemoteZip(url, verify=False) as z:
              infos=z.infolist()
              objs=[i for i in infos if '_L15_' in i.filename and i.filename.endswith('.obj')]
              sample=max(objs, key=lambda i:i.file_size)
              stem=sample.filename[:-4]
              mtl=next(i for i in infos if i.filename == stem+'.mtl')
              jpg=next(i for i in infos if i.filename.startswith(stem+'_') and i.filename.endswith('.jpg'))
              objtext=z.read(sample).decode('utf-8',errors='replace')
              mtltext=z.read(mtl).decode('utf-8',errors='replace')
              image=Image.open(io.BytesIO(z.read(jpg)))
              print('SAMPLE', sample.filename, 'OBJ', sample.file_size, 'MTL', mtl.file_size, 'IMAGE', jpg.filename, image.size)
              print('--- OBJ HEAD ---')
              print('\n'.join(objtext.splitlines()[:80]))
              print('--- MTL ---')
              print(mtltext)
              verts=[]
              for line in objtext.splitlines():
                  if line.startswith('v '):
                      p=line.split(); verts.append(tuple(map(float,p[1:4])))
              print('VERTS',len(verts))
              for axis in range(3):
                  vals=[v[axis] for v in verts]
                  print('AXIS',axis,min(vals),max(vals))
          PY

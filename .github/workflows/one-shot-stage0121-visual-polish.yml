name: One-shot Stage 012.1 visual polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-stage0121-visual-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply HUD, exhaust, and canopy cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # HUD cleanup from the phone screenshots.
          p = Path('App/ContentView.swift')
          s = p.read_text()

          replacements = [
              ('''                    F16BankAngleIndicator(rollDegrees: state.rollDegrees, color: hudColor)\n                        .offset(x: fpmX, y: fpmY)\n\n''', ''),
              ('''                    F16VerticalVelocityScale(state: state, color: hudColor)\n                        .offset(x: hudWidth * 0.59)\n\n''', ''),
              ('''                    F16VelocityScale(state: state, color: hudColor)\n                        .offset(x: -hudWidth * 0.48)\n\n                    F16AltitudeScale(state: state, color: hudColor)\n                        .offset(x: hudWidth * 0.47)\n''', '''                    // Keep the primary airspeed/altitude presentations well outside\n                    // the flight-path/pitch-ladder field. The previous offsets packed\n                    // both tapes against the center of the HUD on iPhone.\n                    F16VelocityScale(state: state, color: hudColor)\n                        .offset(x: -hudWidth * 0.68)\n\n                    F16AltitudeScale(state: state, color: hudColor)\n                        .offset(x: hudWidth * 0.67)\n''')
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit('ContentView anchor missing: ' + old.splitlines()[0])
              s = s.replace(old, new, 1)
          p.write_text(s)

          # F-16 appearance cleanup.
          p = Path('Aircraft/PrototypeAircraftFactory.swift')
          s = p.read_text()

          # Make the canopy read as smoked F-16 glass instead of a large brown polygon.
          old = '            material(UIColor(red: 0.16, green: 0.12, blue: 0.075, alpha: 1), roughness: 0.18, metallic: 0.12),'
          new = '            material(UIColor(red: 0.075, green: 0.105, blue: 0.125, alpha: 1), roughness: 0.10, metallic: 0.24),'
          if old not in s: raise SystemExit('canopy material anchor missing')
          s = s.replace(old, new, 1)

          old = '''        // Bronze-tinted bubble canopy.\n        if abs(centroid.x) < 1.10,\n           centroid.z > 1.55,\n           centroid.z < 4.65,\n           centroid.y > 0.62 {\n            return Paint.canopy.rawValue\n        }\n'''
          new = '''        // F-16 bubble canopy. Use a tapered planform instead of the old\n        // rectangular classifier, which painted a broad slab of upper fuselage\n        // as glass and made the canopy look blocky from chase view.\n        let canopyCenterZ: Float = 3.10\n        let canopyHalfLength: Float = 1.47\n        let canopyLongitudinal = (centroid.z - canopyCenterZ) / canopyHalfLength\n        if abs(canopyLongitudinal) < 1.0 {\n            let widthProfile = sqrt(max(0, 1 - canopyLongitudinal * canopyLongitudinal))\n            let canopyHalfWidth = 0.16 + 0.68 * widthProfile\n            if abs(centroid.x) < canopyHalfWidth,\n               centroid.y > 0.70,\n               averageNormal.y > -0.48 {\n                return Paint.canopy.rawValue\n            }\n        }\n'''
          if old not in s: raise SystemExit('canopy classifier anchor missing')
          s = s.replace(old, new, 1)

          # Warm F100-style afterburner palette requested by the user: red/orange\n          # envelope, orange-hot interior and pale-yellow core instead of blue.
          palette = [
              ('''                red: 0.22,\n                green: 0.12,\n                blue: 0.78,\n                alpha: 0.13''', '''                red: 0.82,\n                green: 0.10,\n                blue: 0.025,\n                alpha: 0.15'''),
              ('''                red: 0.08,\n                green: 0.28,\n                blue: 1.0,\n                alpha: 0.28''', '''                red: 1.0,\n                green: 0.24,\n                blue: 0.035,\n                alpha: 0.34'''),
              ('''                red: 0.42,\n                green: 0.76,\n                blue: 1.0,\n                alpha: 0.50''', '''                red: 1.0,\n                green: 0.52,\n                blue: 0.075,\n                alpha: 0.56'''),
              ('''                red: 0.94,\n                green: 0.97,\n                blue: 1.0,\n                alpha: 0.82''', '''                red: 1.0,\n                green: 0.88,\n                blue: 0.48,\n                alpha: 0.86'''),
              ('''                    red: 0.82,\n                    green: 0.92,\n                    blue: 1.0,\n                    alpha: CGFloat(max(0.11, 0.30 - Float(index) * 0.038))''', '''                    red: 1.0,\n                    green: 0.66,\n                    blue: 0.20,\n                    alpha: CGFloat(max(0.055, 0.15 - Float(index) * 0.020))'''),
              ('''                red: 0.58,\n                green: 0.75,\n                blue: 1.0,\n                alpha: 0.52''', '''                red: 1.0,\n                green: 0.30,\n                blue: 0.055,\n                alpha: 0.56''')
          ]
          for old, new in palette:
              if old not in s:
                  raise SystemExit('afterburner palette anchor missing')
              s = s.replace(old, new, 1)

          old = '        let shockR: [Float] = [0.34, 0.31, 0.27, 0.23, 0.19]'
          new = '        let shockR: [Float] = [0.24, 0.215, 0.19, 0.165, 0.14]'
          if old not in s: raise SystemExit('shock radius anchor missing')
          s = s.replace(old, new, 1)

          old = '                mesh: .generateCylinder(height: 0.055, radius: shockR[index]),'
          new = '                mesh: .generateCylinder(height: 0.030, radius: shockR[index]),'
          if old not in s: raise SystemExit('shock thickness anchor missing')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit directly to main
        run: |
          set -euo pipefail
          git config user.name 'NyerahMT'
          git config user.email '68287092+NyerahMT@users.noreply.github.com'
          git add App/ContentView.swift Aircraft/PrototypeAircraftFactory.swift
          git rm .github/workflows/one-shot-stage0121-visual-polish.yml
          git commit -m 'Stage 012.1: clean HUD spacing, canopy and warm exhaust'
          git push origin HEAD:main

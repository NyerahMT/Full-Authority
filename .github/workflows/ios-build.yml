name: iOS Build

on:
  push:
    branches:
      - main
    paths:
      - 'App/**'
      - 'Simulation/**'
      - 'Aircraft/**'
      - 'World/**'
      - 'Assets/**'
      - 'scripts/**'
      - 'ThirdParty/**'
      - '.gitmodules'
      - 'FullAuthority.xcodeproj/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'App/**'
      - 'Simulation/**'
      - 'Aircraft/**'
      - 'World/**'
      - 'Assets/**'
      - 'scripts/**'
      - 'ThirdParty/**'
      - '.gitmodules'
      - 'FullAuthority.xcodeproj/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-authority-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  IOS_DEPLOYMENT_TARGET: '18.0'

jobs:
  simulator:
    name: Build iOS Simulator
    runs-on: macos-26
    steps:
      - name: Checkout Full Authority
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install NATO F-16 runtime assets
        run: |
          set -euo pipefail
          chmod +x scripts/install-f16-nato-assets.sh
          scripts/install-f16-nato-assets.sh

      - name: Bake coherent fixed theater
        run: |
          set -euo pipefail
          node scripts/bake-worldsmith-theater.mjs
          test -s Assets/JSBSim/visuals/world/worldsmith_1337_height_1025.r16
          test -s Assets/JSBSim/visuals/world/worldsmith_1337_albedo_1024.png
          test -s Assets/JSBSim/visuals/world/worldsmith_1337_landclass_1024.png
          test -s Assets/JSBSim/visuals/world/worldsmith_1337_features.json
          test -s Assets/JSBSim/visuals/world/worldsmith_water_normal_256.png
          test -s Assets/JSBSim/visuals/world/worldsmith_1337_manifest.json

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          cmake --version
          xcodebuild -project FullAuthority.xcodeproj -list

      - name: Build JSBSim for simulator
        run: |
          set -euo pipefail
          chmod +x scripts/build-jsbsim-ios.sh
          scripts/build-jsbsim-ios.sh iphonesimulator
          test -f Build/JSBSim/iphonesimulator/lib/libJSBSim.a
          lipo -info Build/JSBSim/iphonesimulator/lib/libJSBSim.a

      - name: Build Full Authority
        run: |
          set -euo pipefail
          xcodebuild \
            -project FullAuthority.xcodeproj \
            -target FullAuthority \
            -configuration Debug \
            -sdk iphonesimulator \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            build

      - name: Verify simulator assets
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/Debug-iphonesimulator/FullAuthority.app"
          chmod +x scripts/stage-f16-calibration.sh
          scripts/stage-f16-calibration.sh "$APP_PATH"
          test -s "$APP_PATH/JSBSim/aircraft/f16/f16.xml"
          test -s "$APP_PATH/JSBSim/engine/F100-PW-229.xml"
          test -s "$APP_PATH/JSBSim/engine/direct.xml"
          test -s "$APP_PATH/JSBSim/visuals/f16/f16_static.obj"
          test -s "$APP_PATH/JSBSim/visuals/f16_nato/f16_nato_body.famesh"
          test -s "$APP_PATH/JSBSim/visuals/f16_nato/f16_nato_canopy.famesh"
          test -s "$APP_PATH/JSBSim/visuals/f16_nato/f16_nato_cockpit.famesh"
          test -s "$APP_PATH/JSBSim/visuals/f16_nato/f16_nato_body_basecolor.png"
          test -s "$APP_PATH/JSBSim/visuals/f16_nato/f16_nato_body_normal.png"
          test -s "$APP_PATH/JSBSim/visuals/f16_nato/f16_nato_cockpit_basecolor.png"
          test -s "$APP_PATH/JSBSim/visuals/f16_nato/ATTRIBUTION.md"
          test -s "$APP_PATH/JSBSim/visuals/world/worldsmith_1337_height_1025.r16"
          test -s "$APP_PATH/JSBSim/visuals/world/worldsmith_1337_albedo_1024.png"
          test -s "$APP_PATH/JSBSim/visuals/world/worldsmith_1337_landclass_1024.png"
          test -s "$APP_PATH/JSBSim/visuals/world/worldsmith_1337_features.json"
          test -s "$APP_PATH/JSBSim/visuals/world/worldsmith_water_normal_256.png"
          test -s "$APP_PATH/JSBSim/visuals/world/LICENSE-Worldsmith.txt"

      - name: Package simulator app
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/Debug-iphonesimulator/FullAuthority.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "$PWD/build/FullAuthority-simulator.zip"

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: FullAuthority-simulator
          path: build/FullAuthority-simulator.zip
          if-no-files-found: error
          retention-days: 7

  device:
    name: Build unsigned iPhone IPA
    runs-on: macos-26
    steps:
      - name: Checkout Full Authority
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install NATO F-16 runtime assets
        run: |
          set -euo pipefail
          chmod +x scripts/install-f16-nato-assets.sh
          scripts/install-f16-nato-assets.sh

      - name: Bake coherent fixed theater
        run: |
          set -euo pipefail
          node scripts/bake-worldsmith-theater.mjs
          test -s Assets/JSBSim/visuals/world/worldsmith_1337_height_1025.r16
          test -s Assets/JSBSim/visuals/world/worldsmith_1337_albedo_1024.png
          test -s Assets/JSBSim/visuals/world/worldsmith_1337_landclass_1024.png
          test -s Assets/JSBSim/visuals/world/worldsmith_1337_features.json
          test -s Assets/JSBSim/visuals/world/worldsmith_water_normal_256.png
          test -s Assets/JSBSim/visuals/world/worldsmith_1337_manifest.json

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version

      - name: Build JSBSim for iPhoneOS
        run: |
          set -euo pipefail
          chmod +x scripts/build-jsbsim-ios.sh
          scripts/build-jsbsim-ios.sh iphoneos
          test -f Build/JSBSim/iphoneos/lib/libJSBSim.a
          lipo -info Build/JSBSim/iphoneos/lib/libJSBSim.a

      - name: Build for iPhoneOS
        run: |
          set -euo pipefail
          xcodebuild \
            -project FullAuthority.xcodeproj \
            -scheme FullAuthority \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Verify device assets
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/device/Build/Products/Release-iphoneos/FullAuthority.app"
          chmod +x scripts/stage-f16-calibration.sh
          scripts/stage-f16-calibration.sh "$APP_PATH"
          test -s "$APP_PATH/JSBSim/aircraft/f16/f16.xml"
          test -s "$APP_PATH/JSBSim/engine/F100-PW-229.xml"
          test -s "$APP_PATH/JSBSim/engine/direct.xml"
          test -s "$APP_PATH/JSBSim/visuals/f16/f16_static.obj"
          test -s "$APP_PATH/JSBSim/visuals/f16_nato/f16_nato_body.famesh"
          test -s "$APP_PATH/JSBSim/visuals/f16_nato/f16_nato_canopy.famesh"
          test -s "$APP_PATH/JSBSim/visuals/f16_nato/f16_nato_cockpit.famesh"
          test -s "$APP_PATH/JSBSim/visuals/f16_nato/f16_nato_body_basecolor.png"
          test -s "$APP_PATH/JSBSim/visuals/f16_nato/f16_nato_body_normal.png"
          test -s "$APP_PATH/JSBSim/visuals/f16_nato/f16_nato_cockpit_basecolor.png"
          test -s "$APP_PATH/JSBSim/visuals/f16_nato/ATTRIBUTION.md"
          test -s "$APP_PATH/JSBSim/visuals/world/worldsmith_1337_height_1025.r16"
          test -s "$APP_PATH/JSBSim/visuals/world/worldsmith_1337_albedo_1024.png"
          test -s "$APP_PATH/JSBSim/visuals/world/worldsmith_1337_landclass_1024.png"
          test -s "$APP_PATH/JSBSim/visuals/world/worldsmith_1337_features.json"
          test -s "$APP_PATH/JSBSim/visuals/world/worldsmith_water_normal_256.png"
          test -s "$APP_PATH/JSBSim/visuals/world/LICENSE-Worldsmith.txt"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/device/Build/Products/Release-iphoneos/FullAuthority.app"
          rm -rf "$PWD/package"
          mkdir -p "$PWD/package/Payload"
          cp -R "$APP_PATH" "$PWD/package/Payload/"
          cd "$PWD/package"
          zip -qry "$GITHUB_WORKSPACE/FullAuthority-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/FullAuthority-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FullAuthority-unsigned-ipa
          path: FullAuthority-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

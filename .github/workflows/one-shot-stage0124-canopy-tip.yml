name: Stage 012.4 Canopy Tip
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-stage0124-canopy-tip.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Aircraft/PrototypeAircraftFactory.swift')
          s = p.read_text()
          s = s.replace('let forwardBubble = p.z > 3.05 && p.y > 0.58 && abs(p.x) < 0.88', 'let forwardBubble = p.z > 3.00 && p.y > 0.40 && abs(p.x) < 0.80', 1)
          s = s.replace('? cos(Float.pi * 52.0 / 180.0)', '? cos(Float.pi * 64.0 / 180.0)', 1)
          p.write_text(s)
          PY
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/one-shot-stage0124-canopy-tip.yml
          git config user.name NyerahMT
          git config user.email 68287092+NyerahMT@users.noreply.github.com
          git add Aircraft/PrototypeAircraftFactory.swift .github/workflows/one-shot-stage0124-canopy-tip.yml
          git commit -m 'Stage 012.4: finish forward canopy glass'
          git push

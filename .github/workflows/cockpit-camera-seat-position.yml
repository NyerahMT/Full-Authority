name: Cockpit Camera Seat Position

on:
  push:
    branches: [cockpit-camera-seat-position]
    paths:
      - Scripts/patch_cockpit_camera.py
      - .github/workflows/cockpit-camera-seat-position.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cockpit-camera-seat-position
          fetch-depth: 0
      - name: Apply cockpit camera patch
        run: python3 Scripts/patch_cockpit_camera.py
      - name: Commit camera adjustment
        shell: bash
        run: |
          git config user.name "Full Authority Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add App/PrototypeSceneView.swift
          git commit -m "Move cockpit camera back and up"
          git push origin HEAD:cockpit-camera-seat-position

name: Stage021 Phone Feedback Hotfix

on:
  push:
    branches:
      - stage021-vfx-audio-atmosphere
    paths:
      - '.github/workflows/stage021-yaw-regression.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage021-vfx-audio-atmosphere

      - name: Correct airborne rudder sign and burner color
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          sim = Path('Simulation/FlightSimulation.swift')
          text = sim.read_text(encoding='utf-8')
          old = (
              "        // Full Authority's touch control is screen-centric: dragging right means\n"
              "        // right pedal / nose-right. Stage 020 feeds this pilot command into the\n"
              "        // F-16 scheduler once; stability feedback remains a separate SAS signal.\n"
              "        let pilotYawCommand = -Double(controls.rudder)\n"
              "        let rudder = clamp(trimRudderCommand + pilotYawCommand, min: -1, max: 1)\n"
          )
          new = (
              "        // Airborne rudder and nosewheel steering use opposite sign conventions\n"
              "        // in the current JSBSim F-16 model. Preserve the already-correct ground\n"
              "        // steering direction while making touch-right command aerodynamic nose-right.\n"
              "        let pilotRudderCommand = Double(controls.rudder)\n"
              "        let rudder = clamp(trimRudderCommand + pilotRudderCommand, min: -1, max: 1)\n"
          )
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('airborne rudder block not found')

          old_steer = (
              "        let steering = state.weightOnWheels && state.gearPosition > 0.8\n"
              "            ? clamp(pilotYawCommand, min: -1, max: 1)\n"
              "            : 0\n"
          )
          new_steer = (
              "        let steeringCommand = -Double(controls.rudder)\n"
              "        let steering = state.weightOnWheels && state.gearPosition > 0.8\n"
              "            ? clamp(steeringCommand, min: -1, max: 1)\n"
              "            : 0\n"
          )
          if old_steer in text:
              text = text.replace(old_steer, new_steer, 1)
          elif new_steer not in text:
              raise SystemExit('ground steering block not found')
          sim.write_text(text, encoding='utf-8')

          aircraft = Path('Aircraft/PrototypeAircraftFactory.swift')
          text = aircraft.read_text(encoding='utf-8')
          old_blue = (
              "            materials: [UnlitMaterial(color: UIColor(\n"
              "                red: 0.34,\n"
              "                green: 0.47,\n"
              "                blue: 1.00,\n"
              "                alpha: 0.075\n"
              "            ))]\n"
          )
          new_warm = (
              "            materials: [UnlitMaterial(color: UIColor(\n"
              "                red: 1.00,\n"
              "                green: 0.18,\n"
              "                blue: 0.015,\n"
              "                alpha: 0.055\n"
              "            ))]\n"
          )
          if old_blue in text:
              text = text.replace(old_blue, new_warm, 1)
          elif new_warm not in text:
              raise SystemExit('blue afterburner halo not found')
          aircraft.write_text(text, encoding='utf-8')
          PY

          grep -q 'let pilotRudderCommand = Double(controls.rudder)' Simulation/FlightSimulation.swift
          grep -q 'let steeringCommand = -Double(controls.rudder)' Simulation/FlightSimulation.swift
          ! grep -q 'blue: 1.00' Aircraft/PrototypeAircraftFactory.swift

      - name: Commit source hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NyerahMT'
          git config user.email '68287092+NyerahMT@users.noreply.github.com'
          git add Simulation/FlightSimulation.swift Aircraft/PrototypeAircraftFactory.swift
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Hotfix already applied'
            exit 0
          fi
          git commit -m 'Stage 021: fix airborne rudder direction and remove blue flame halo'
          git push origin HEAD:stage021-vfx-audio-atmosphere

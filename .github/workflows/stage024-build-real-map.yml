name: Stage024 Build Real Reno Map
on:
  push:
    branches: [stage024-real-reno-map]
    paths: ['.github/workflows/stage024-build-real-map.yml']
permissions:
  contents: write
jobs:
  build-map:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage024-real-reno-map
          submodules: false
          fetch-depth: 1
      - name: Install geospatial pipeline
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy requests pillow pyproj shapely rasterio geopandas pyogrio
      - name: Patch USGS imagery export into reliable tiles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('Scripts/build_stage024_reno_map.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'def export_usgs_imagery\(\) -> None:.*?\n\ndef extract_geofabrik\(\) -> Path:', re.S)
          replacement = r'''def export_usgs_imagery() -> None:
              # A single 4096x4096 ArcGIS export can time out on the USGS service.
              # Request sixteen 1024x1024 tiles instead and stitch them into the
              # same 4096 macro image. Each tile is only 12 km square, which keeps
              # the public service query cheap while preserving map alignment.
              import time

              path = OUT / "reno_imagery.jpg"
              if path.exists() and path.stat().st_size > 100_000:
                  return

              service = "https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/export"
              tiles_per_axis = 4
              tile_pixels = IMAGERY_SIZE // tiles_per_axis
              span_x = MAX_X - MIN_X
              span_z = MAX_Z - MIN_Z
              tile_world_x = span_x / tiles_per_axis
              tile_world_z = span_z / tiles_per_axis
              canvas = Image.new("RGB", (IMAGERY_SIZE, IMAGERY_SIZE))

              for row in range(tiles_per_axis):
                  # Image row zero is north/top, so request rows from MAX_Z downward.
                  z_max = MAX_Z - row * tile_world_z
                  z_min = z_max - tile_world_z
                  for col in range(tiles_per_axis):
                      x_min = MIN_X + col * tile_world_x
                      x_max = x_min + tile_world_x
                      bbox = (
                          f"{ORIGIN_E + x_min},{ORIGIN_N + z_min},"
                          f"{ORIGIN_E + x_max},{ORIGIN_N + z_max}"
                      )
                      params = {
                          "bbox": bbox,
                          "bboxSR": "32611",
                          "imageSR": "32611",
                          "size": f"{tile_pixels},{tile_pixels}",
                          "format": "jpg",
                          "transparent": "false",
                          "dpi": "96",
                          "f": "image",
                      }
                      tile_path = CACHE / f"reno_usgs_{row}_{col}.jpg"

                      if not (tile_path.exists() and tile_path.stat().st_size > 4096):
                          last_error = None
                          for attempt in range(1, 5):
                              try:
                                  log(f"USGS imagery tile {row + 1},{col + 1} attempt {attempt}")
                                  response = requests.get(service, params=params, timeout=90)
                                  response.raise_for_status()
                                  content_type = response.headers.get("content-type", "")
                                  if "image" not in content_type.lower():
                                      raise RuntimeError(
                                          f"USGS tile returned {content_type}: {response.text[:300]}"
                                      )
                                  tile_path.write_bytes(response.content)
                                  break
                              except Exception as exc:
                                  last_error = exc
                                  tile_path.unlink(missing_ok=True)
                                  if attempt < 4:
                                      time.sleep(attempt * 3)
                          else:
                              raise RuntimeError(
                                  f"USGS imagery tile {row},{col} failed after retries: {last_error}"
                              )

                      with Image.open(tile_path) as tile:
                          tile = tile.convert("RGB")
                          if tile.size != (tile_pixels, tile_pixels):
                              tile = tile.resize(
                                  (tile_pixels, tile_pixels),
                                  Image.Resampling.LANCZOS,
                              )
                          canvas.paste(tile, (col * tile_pixels, row * tile_pixels))

              canvas.save(path, "JPEG", quality=88, optimize=True, progressive=True)
              log(f"USGS orthoimagery {path.stat().st_size / 1024 / 1024:.1f} MiB")


          def extract_geofabrik() -> Path:'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one imagery function, found {count}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Build KRNO real-world map package
        run: python3 Scripts/build_stage024_reno_map.py
      - name: Validate package
        run: |
          set -euo pipefail
          test -s Assets/JSBSim/visuals/world/reno/reno_dem.bin
          test -s Assets/JSBSim/visuals/world/reno/reno_imagery.jpg
          test -s Assets/JSBSim/visuals/world/reno/reno_world.json
          grep -q 'Stage024RealMapWorld.make' App/Stage2WorldFactory.swift
          grep -q 'Stage024RealMap.swift in Sources' FullAuthority.xcodeproj/project.pbxproj
          grep -q 'gTerrainGrid.Load' Simulation/Bridge/FAJSBSimBridge.mm
          grep -q 'sixteen 1024x1024 tiles' Scripts/build_stage024_reno_map.py
          python3 - <<'PY'
          import json, pathlib, struct
          root = pathlib.Path('Assets/JSBSim/visuals/world/reno')
          raw = (root/'reno_dem.bin').read_bytes()
          magic, version, w, h, cell, minx, minz, ref = struct.unpack('<4sIIIffff', raw[:32])
          assert magic == b'FAM2' and version == 1 and w > 500 and h > 500
          world = json.loads((root/'reno_world.json').read_text())
          assert len(world['buildings']) > 5000, len(world['buildings'])
          assert len(world['roads']) > 500, len(world['roads'])
          print('DEM', w, h, cell, 'buildings', len(world['buildings']), 'roads', len(world['roads']))
          for p in root.iterdir():
              print(p.name, round(p.stat().st_size/1024/1024, 2), 'MiB')
          PY
          git diff --check
      - name: Commit generated real map
        run: |
          set -euo pipefail
          git config user.name 'NyerahMT'
          git config user.email '68287092+NyerahMT@users.noreply.github.com'
          git add Assets/JSBSim/visuals/world/reno App/Stage024RealMap.swift App/Stage2WorldFactory.swift App/Stage022MainMenu.swift Simulation/FlightSimulation.swift Simulation/Bridge/FAJSBSimBridge.mm FullAuthority.xcodeproj/project.pbxproj Docs/Stage024-Real-Reno-Map.md Scripts/build_stage024_reno_map.py
          git commit -m 'Stage 024: replace procedural world with real Reno map'
          git push origin HEAD:stage024-real-reno-map

name: Stage 022 Malta Full Import

on:
  push:
    branches:
      - stage022-malta-full-import
    paths:
      - 'scripts/bake-stage022-terrain.py'
      - 'scripts/repack-stage022-osm2world.py'
      - 'World/Stage022/**'
      - '.github/workflows/stage022-full-import.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage022-malta-full-import
  cancel-in-progress: true

env:
  OSM2WORLD_COMMIT: 8ec26a9ea426444a4f7882cf0cfcab432c876ae5
  OSM2WORLD_STYLE_COMMIT: 81ade9bf9793181774891548ac29448f366efd3c
  MALTA_PBF_URL: https://download.geofabrik.de/europe/malta-latest.osm.pbf
  GOL_TOOL_VERSION: '1.2.0'
  GOL_TOOL_SHA256: 2589dbb30dd877dbcabf07f358c56c1c339851e018f95426b9d89400706cf93e

jobs:
  bake:
    name: Bake full Maltese archipelago
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Full Authority
        uses: actions/checkout@v6
        with:
          ref: stage022-malta-full-import
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python baker dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy requests pillow

      - name: Fetch pinned OSM2World and CC0 style
        run: |
          set -euo pipefail
          mkdir -p Build/stage022

          git init -q Build/stage022/OSM2World
          git -C Build/stage022/OSM2World remote add origin https://github.com/tordanik/OSM2World.git
          git -C Build/stage022/OSM2World fetch --depth 1 origin "$OSM2WORLD_COMMIT"
          git -C Build/stage022/OSM2World checkout -q FETCH_HEAD
          test "$(git -C Build/stage022/OSM2World rev-parse HEAD)" = "$OSM2WORLD_COMMIT"

          git init -q Build/stage022/style
          git -C Build/stage022/style remote add origin https://github.com/tordanik/OSM2World-default-style.git
          git -C Build/stage022/style fetch --depth 1 origin "$OSM2WORLD_STYLE_COMMIT"
          git -C Build/stage022/style checkout -q FETCH_HEAD
          test "$(git -C Build/stage022/style rev-parse HEAD)" = "$OSM2WORLD_STYLE_COMMIT"

      - name: Cache OSM2World Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-osm2world-${{ env.OSM2WORLD_COMMIT }}
          restore-keys: |
            ${{ runner.os }}-osm2world-

      - name: Trim unused OSM2World build dependencies
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root_dir = Path('Build/stage022/OSM2World')
          ns_uri = 'http://maven.apache.org/POM/4.0.0'
          ns = {'m': ns_uri}
          ET.register_namespace('', ns_uri)

          # Only osm2world-opengl actually needs JogAmp. Leaving the repository in
          # core-jvm and desktop makes Maven probe the slow JogAmp server for every
          # unrelated Apache/Topobyte/JTS dependency before trying the proper repos.
          for rel in ('core-jvm/pom.xml', 'desktop/pom.xml'):
              path = root_dir / rel
              tree = ET.parse(path)
              root = tree.getroot()
              repositories = root.find('m:repositories', ns)
              if repositories is not None:
                  root.remove(repositories)
              tree.write(path, encoding='utf-8', xml_declaration=True)

          # The GLB CLI needs JOGL classes at compile time because desktop also
          # contains the GUI/image commands, but our headless tileset conversion does
          # not need native binaries for five operating systems/architectures.
          path = root_dir / 'opengl/pom.xml'
          tree = ET.parse(path)
          root = tree.getroot()
          dependencies = root.find('m:dependencies', ns)
          removed = 0
          if dependencies is not None:
              for dependency in list(dependencies):
                  if dependency.find('m:classifier', ns) is not None:
                      dependencies.remove(dependency)
                      removed += 1
          tree.write(path, encoding='utf-8', xml_declaration=True)
          print(f'Removed {removed} unused native JOGL/GlueGen dependencies')
          if removed < 8:
              raise SystemExit('Unexpected OSM2World OpenGL POM layout; refusing a partial dependency trim')
          PY

          test "$(grep -R 'jogamp.org/deployment/maven' Build/stage022/OSM2World/{core-jvm,desktop,opengl}/pom.xml | wc -l)" -eq 1
          ! grep -q '<classifier>' Build/stage022/OSM2World/opengl/pom.xml

      - name: Build OSM2World CLI
        run: |
          set -euo pipefail
          mvn \
            -B -ntp -T 1C \
            -f Build/stage022/OSM2World/pom.xml \
            -DskipTests \
            -Dmaven.javadoc.skip=true \
            -Dmaven.source.skip=true \
            -pl desktop -am package
          test -s Build/stage022/OSM2World/desktop/target/osm2world-desktop-0.5.0-SNAPSHOT.jar

      - name: Download Malta OpenStreetMap extract
        run: |
          set -euo pipefail
          mkdir -p Build/stage022/input
          curl --fail --location --retry 4 --retry-delay 3 \
            "$MALTA_PBF_URL" \
            -o Build/stage022/input/malta-latest.osm.pbf
          test -s Build/stage022/input/malta-latest.osm.pbf

      - name: Build indexed Malta GeoDesk database
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/Build/stage022/gol-tool-${GOL_TOOL_VERSION}.zip"
          GOL_DIR="$GITHUB_WORKSPACE/Build/stage022/gol-tool"

          curl --fail --location --retry 4 --retry-delay 3 \
            "https://github.com/clarisma/gol-tool/releases/download/${GOL_TOOL_VERSION}/gol-tool-${GOL_TOOL_VERSION}.zip" \
            -o "$ZIP"
          echo "${GOL_TOOL_SHA256}  ${ZIP}" | sha256sum -c -

          rm -rf "$GOL_DIR"
          mkdir -p "$GOL_DIR"
          unzip -q "$ZIP" -d "$GOL_DIR"
          GOL="$(find "$GOL_DIR" -type f -path '*/bin/gol' -print -quit)"
          test -n "$GOL"
          chmod +x "$GOL"
          GOL="$(realpath "$GOL")"

          # OSM2World's generic PBF reader falls back to reading the complete PBF for
          # every tile. GeoDesk gives it an indexed spatial query instead. Malta is
          # tiny, so paying this indexing cost once is far cheaper than ~1,195 full
          # PBF reads during the two-LOD scenery bake.
          (
            cd "$GITHUB_WORKSPACE/Build/stage022/input"
            "$GOL" build malta malta-latest.osm.pbf
          )
          test -s Build/stage022/input/malta.gol
          ls -lh Build/stage022/input/malta-latest.osm.pbf Build/stage022/input/malta.gol

      - name: Bake expanded shared terrain
        run: |
          set -euo pipefail
          python scripts/bake-stage022-terrain.py
          test -s Simulation/Bridge/Stage022MaltaTerrain.inc
          test -s Docs/Stage022MaltaTerrain.json

      - name: Generate OSM2World LOD2 and LOD4 tiles
        run: |
          set -euo pipefail
          STYLE="$GITHUB_WORKSPACE/Build/stage022/style"
          O2W="$GITHUB_WORKSPACE/Build/stage022/OSM2World/desktop/target/osm2world-desktop-0.5.0-SNAPSHOT.jar"
          INPUT="$GITHUB_WORKSPACE/Build/stage022/input/malta.gol"
          OUT="$GITHUB_WORKSPACE/Build/stage022/o2w"

          cat "$STYLE/standard.properties" "$GITHUB_WORKSPACE/World/Stage022/osm2world-overrides.properties" \
            > "$STYLE/full-authority.properties"

          cd "$STYLE"

          report_progress() {
            local label="$1"
            local lod2 lod4 total
            lod2="$(find "$OUT/lod2" -name '*.glb' 2>/dev/null | wc -l)"
            lod4="$(find "$OUT/lod4" -name '*.glb' 2>/dev/null | wc -l)"
            total=$((lod2 + lod4))
            echo "[$(date -u +'%H:%M:%S UTC')] ${label}: LOD2=${lod2}, LOD4=${lod4}, total GLBs=${total}"
          }

          run_tileset() {
            local label="$1"
            shift
            echo "Starting ${label} scenery generation..."
            report_progress "$label"

            java -Xmx7g -jar "$O2W" tileset \
              --input "$INPUT" \
              --baseDir "$OUT" \
              --lod 2 4 \
              --noJson \
              --config "$STYLE/full-authority.properties" \
              "$@" &
            local pid=$!

            # OSM2World uses an interactive carriage-return progress bar which is
            # effectively invisible in GitHub Actions. Emit durable progress lines so
            # a healthy long bake can never look hung again.
            while kill -0 "$pid" 2>/dev/null; do
              sleep 30
              if kill -0 "$pid" 2>/dev/null; then
                report_progress "$label"
              fi
            done
            wait "$pid"
            report_progress "$label complete"
          }

          # Mainland Malta. OSM2World itself parallelizes tiles across the JVM common
          # fork/join pool, so do not spawn competing Java tile workers on one runner.
          run_tileset "Mainland Malta" \
            --bbox "35.770,14.295 36.005,14.600"

          # Gozo + Comino. NEVER keeps overlap tiles generated by the first pass.
          run_tileset "Gozo + Comino" \
            --bbox "35.975,14.150 36.110,14.470" \
            --overwrite NEVER

          test -n "$(find "$OUT/lod2" -name '*.glb' -print -quit)"
          test -n "$(find "$OUT/lod4" -name '*.glb' -print -quit)"
          echo "LOD2 GLBs: $(find "$OUT/lod2" -name '*.glb' | wc -l)"
          echo "LOD4 GLBs: $(find "$OUT/lod4" -name '*.glb' | wc -l)"

      - name: Repack OSM2World geometry for RealityKit
        run: |
          set -euo pipefail
          python scripts/repack-stage022-osm2world.py --tiles Build/stage022/o2w
          test -s Docs/Stage022MaltaFullWorld.json
          test -n "$(find Assets/JSBSim/visuals/world/stage022/lod2 -name '*.bin' -print -quit)"
          test -n "$(find Assets/JSBSim/visuals/world/stage022/lod4 -name '*.bin' -print -quit)"

          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('Docs/Stage022MaltaFullWorld.json').read_text())
          stats = manifest['stats']
          print(json.dumps(stats, indent=2))
          if stats['packedVertices'] <= 0 or stats['packedTriangles'] <= 0:
              raise SystemExit('Stage 022 repack produced empty geometry')
          if stats['packedMiB'] > 280:
              raise SystemExit(f"Stage 022 package is unexpectedly large: {stats['packedMiB']} MiB")
          for path in Path('Assets/JSBSim/visuals/world/stage022').rglob('*.bin'):
              if path.stat().st_size >= 95 * 1024 * 1024:
                  raise SystemExit(f'Chunk exceeds safe GitHub file size: {path}')
          PY

      - name: Commit generated Stage 022 world
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            Simulation/Bridge/Stage022MaltaTerrain.inc \
            Docs/Stage022MaltaTerrain.json \
            Docs/Stage022MaltaFullWorld.json \
            Assets/JSBSim/visuals/world/stage022

          if git diff --cached --quiet; then
            echo 'Generated Stage 022 world is unchanged.'
            exit 0
          fi

          git commit -m 'Bake Stage 022 full Malta scenery'
          git push origin HEAD:stage022-malta-full-import

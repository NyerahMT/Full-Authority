name: Stage 012.5 Compile Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-stage0125-compilefix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix canopy queue collection type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Aircraft/PrototypeAircraftFactory.swift')
          s=p.read_text()
          old='''        var frontClosureQueue = selected.filter { index in
            let p = centroids[index]
            return abs(p.x) < 0.55 && p.z > 4.72 && p.y > 0.28
        }
        var frontClosureCursor = 0
'''
          new='''        var frontClosureQueue = Array(selected.filter { index in
            let p = centroids[index]
            return abs(p.x) < 0.55 && p.z > 4.72 && p.y > 0.28
        })
        var frontClosureCursor = 0
'''
          if old not in s:
              raise SystemExit('frontClosureQueue block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          rm -f .github/workflows/one-shot-stage0125-compilefix.yml
          git config user.name "NyerahMT"
          git config user.email "68287092+NyerahMT@users.noreply.github.com"
          git add Aircraft/PrototypeAircraftFactory.swift .github/workflows/one-shot-stage0125-compilefix.yml
          git commit -m "Stage 012.5.1: fix canopy closure queue type"
          git push

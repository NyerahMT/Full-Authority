name: Stage 012.5 Canopy Loop

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-stage0125-canopy-loop.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply canopy loop patch
        run: python3 Scripts/patch_canopy_loop.py
      - name: Commit
        run: |
          rm -f .github/workflows/one-shot-canopy-diagnose.yml
          rm -f .github/workflows/one-shot-stage0125-canopy-loop.yml
          rm -f Scripts/patch_canopy_loop.py
          git config user.name NyerahMT
          git config user.email 68287092+NyerahMT@users.noreply.github.com
          git add -A
          git commit -m 'Stage 012.5: close canopy front from mesh boundary loop'
          git push

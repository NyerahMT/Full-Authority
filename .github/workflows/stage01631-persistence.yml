name: Stage01631Persistence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage01631-persistence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Broaden persistent contrail envelope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('App/Stage2FlightEffects.swift')
          s = p.read_text()
          old = '''        let persistence = clamp((iceRH - 0.96) / 0.20, 0, 1)\n'''
          new = '''        // Persistence is separate from initial formation. The synthetic RHi\n        // field spans a broader range than a true sounding, so begin the long-\n        // lived ice population earlier instead of making almost every visible\n        // contrail collapse into the short core-only regime.\n        let persistence = clamp((iceRH - 0.82) / 0.35, 0, 1)\n'''
          if old not in s:
              raise SystemExit('persistence mapping not found')
          s = s.replace(old, new, 1)
          old = '''            emitting: formsContrail && persistence > 0.08,\n'''
          new = '''            emitting: formsContrail && persistence > 0.02,\n'''
          if old not in s:
              raise SystemExit('diffuse gate not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'NyerahMT'
          git config user.email '68287092+NyerahMT@users.noreply.github.com'
          git add App/Stage2FlightEffects.swift
          git commit -m 'Stage 016.3: extend persistent contrail envelope'
          git push origin HEAD:main

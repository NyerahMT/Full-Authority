name: Stage021YawSweep

on:
  push:
    branches:
      - stage021-vfx-audio-atmosphere
    paths:
      - '.github/workflows/stage021-yaw-sweep.yml'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage021-vfx-audio-atmosphere
          submodules: recursive

      - run: python3 -m pip install --quiet jsbsim

      - name: Stage baseline F-16
        shell: bash
        run: |
          mkdir -p /tmp/FullAuthority.app
          bash scripts/stage-f16-calibration.sh /tmp/FullAuthority.app

      - name: Sweep commanded-flight yaw damping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math
          import shutil
          import jsbsim

          source = Path('/tmp/FullAuthority.app/JSBSim')

          def run_case(gain, command):
              root = Path(f'/tmp/jsbsim-{gain}-{int(command*100)}')
              if root.exists(): shutil.rmtree(root)
              shutil.copytree(source, root)
              xml = root / 'aircraft/f16/f16.xml'
              text = xml.read_text()
              old = '      150.0    112.0'
              new = f'      150.0    {gain:.1f}'
              if text.count(old) != 1:
                  raise RuntimeError(f'gain anchor count {text.count(old)}')
              xml.write_text(text.replace(old, new, 1))

              fdm = jsbsim.FGFDMExec(str(root))
              fdm.set_debug_level(0)
              fdm.set_dt(1/120)
              if not fdm.load_model('f16'): raise RuntimeError('load failed')
              initial = {
                  'ic/lat-geod-deg':0.0, 'ic/long-gc-deg':0.0,
                  'ic/h-sl-ft':15000.0, 'ic/vc-kts':300.0,
                  'ic/alpha-deg':2.0, 'ic/beta-deg':0.0,
                  'ic/phi-deg':0.0, 'ic/theta-deg':2.0,
                  'ic/psi-true-deg':0.0, 'ic/gamma-deg':0.0,
              }
              for k,v in initial.items(): fdm[k] = v
              fdm['propulsion/set-running']=-1
              fdm['fcs/throttle-cmd-norm']=0.62
              fdm['fcs/throttle-cmd-norm[0]']=0.62
              if not fdm.run_ic(): raise RuntimeError('run_ic failed')
              fdm['propulsion/set-running']=-1
              for _ in range(120):
                  fdm['fcs/throttle-cmd-norm']=0.62
                  fdm['fcs/throttle-cmd-norm[0]']=0.62
                  fdm['fcs/rudder-cmd-norm']=0
                  fdm.run()
              beta0=float(fdm['aero/beta-deg'])
              hdg0=float(fdm['attitude/psi-deg'])
              max_r=max_b=max_y=0.0
              for _ in range(180):
                  fdm['fcs/throttle-cmd-norm']=0.62
                  fdm['fcs/throttle-cmd-norm[0]']=0.62
                  fdm['fcs/rudder-cmd-norm']=command
                  fdm.run()
                  max_r=max(max_r,abs(float(fdm['fcs/rudder-pos-rad'])))
                  max_b=max(max_b,abs(float(fdm['aero/beta-deg'])-beta0))
                  max_y=max(max_y,abs(float(fdm['velocities/r-aero-rad_sec'])))
              hdg1=float(fdm['attitude/psi-deg'])
              dh=abs((hdg1-hdg0+180)%360-180)
              return math.degrees(max_r), max_b, math.degrees(max_y), dh

          print('GAIN | PEDAL | RUDDERdeg | BETAdeg | YAWdeg/s | HDGdeg')
          for gain in [112, 90, 75, 60, 50, 40]:
              for command in [0.7, 1.0]:
                  r,b,y,h=run_case(gain,command)
                  print(f'{gain:4.0f} | {command:5.2f} | {r:9.2f} | {b:7.2f} | {y:8.2f} | {h:6.2f}')
          PY

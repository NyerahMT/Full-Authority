name: Stage 010.6 patch

on:
  push:
    branches:
      - stage-010-6-physical-contrails

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage-010-6-physical-contrails
          fetch-depth: 0

      - name: Apply source patch
        run: python3 scripts/stage0106_apply.py

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/stage0106_apply.py .github/workflows/stage0106-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Simulation/AircraftState.swift Simulation/FlightSimulation.swift App/Stage2FlightEffects.swift Aircraft/PrototypeAircraftFactory.swift scripts/stage0106_apply.py .github/workflows/stage0106-patch.yml
          git commit -m "Stage 010.6: physical contrails and surface fit"
          git push origin HEAD:stage-010-6-physical-contrails

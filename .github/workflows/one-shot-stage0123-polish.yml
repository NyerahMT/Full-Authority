name: One-shot Stage 012.3 polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-stage0123-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python3 scripts/stage0123_patch.py
      - name: Commit to main
        run: |
          rm scripts/stage0123_patch.py
          rm .github/workflows/one-shot-stage0123-polish.yml
          git config user.name "NyerahMT"
          git config user.email "68287092+NyerahMT@users.noreply.github.com"
          git add App/ContentView.swift Aircraft/PrototypeAircraftFactory.swift scripts/stage0123_patch.py .github/workflows/one-shot-stage0123-polish.yml
          git commit -m "Stage 012.3: polish HUD canopy and landing gear"
          git push origin main

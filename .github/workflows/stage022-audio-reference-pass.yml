name: Stage022 Audio Reference Pass

on:
  push:
    branches:
      - stage022-main-menu-attract-mode
    paths:
      - '.github/workflows/stage022-audio-reference-pass.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage022-main-menu-attract-mode

      - name: Apply DCS/VTOL-inspired audio and pass changes
        run: python3 scripts/stage022_audio_reference_pass.py

      - name: Verify intent
        run: |
          set -euo pipefail
          grep -q 'static let cameraPosition = SIMD3<Float>(145, 5.8, -190)' App/Stage022MainMenu.swift
          grep -q 'playSupersonicPass' App/Stage022MainMenu.swift
          grep -q 'makeSonicBoomBuffer' App/Stage022MainMenu.swift
          grep -q 'makeTakeoffAfterburnerBuffer' App/Stage022MainMenu.swift
          grep -q 'setAttractModeTransonicVapor' App/Stage2FlightEffects.swift
          grep -q 'cockpitTurbine: Float = isCockpit ? 0.025 : 0.14' App/PrototypeSceneView.swift
          grep -q 'exhaustBands\[2\].gain = -22.0' App/PrototypeSceneView.swift
          git diff --check

      - name: Commit audio/reference pass
        run: |
          set -euo pipefail
          git config user.name 'NyerahMT'
          git config user.email '68287092+NyerahMT@users.noreply.github.com'
          git add App/Stage022MainMenu.swift App/Stage2FlightEffects.swift App/PrototypeSceneView.swift
          git commit -m 'Stage 022: improve jet audio, sonic pass, and menu framing'
          git push origin HEAD:stage022-main-menu-attract-mode

name: Stage018VisualGeneration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/stage018-visual-generation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply complete Stage 018 visual-generation overhaul
        run: python3 Scripts/stage018_visual_generation.py

      - name: Commit Stage 018 as one cohesive revamp
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage018-visual-generation.yml Scripts/stage018_visual_generation.py
          git config user.name "Full Authority Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Stage 018: visual generation overhaul"
          git push

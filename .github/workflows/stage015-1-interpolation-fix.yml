name: Stage015InterpolationFix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage015-1-interpolation-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix transonic entity interpolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('App/Stage2FlightEffects.swift')
          s = p.read_text()
          old = 'named: "\\\\(transonicCloudPrefix).\\\\(layer)"'
          new = 'named: "\\(transonicCloudPrefix).\\(layer)"'
          if old not in s:
              raise SystemExit('escaped transonic lookup not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          rm -f .github/workflows/stage015-1-interpolation-fix.yml
          git config user.name "NyerahMT"
          git config user.email "68287092+NyerahMT@users.noreply.github.com"
          git add App/Stage2FlightEffects.swift .github/workflows/stage015-1-interpolation-fix.yml
          git commit -m "Stage 015.1: fix transonic vapor entity lookup"
          git push

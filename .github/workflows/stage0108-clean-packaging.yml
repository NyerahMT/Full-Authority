name: Stage 010.8 clean packaging

on:
  push:
    branches: [stage-010-8-authored-f16-audio]
    paths:
      - Scripts/cleanup_stage0108_packaging.py
      - .github/workflows/stage0108-clean-packaging.yml

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage-010-8-authored-f16-audio
          fetch-depth: 0
      - run: python3 Scripts/cleanup_stage0108_packaging.py
      - name: Commit retired R4 staging cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stage-f16-calibration.sh
          git diff --cached --quiet || git commit -m "Retire legacy R4 F-16 staging"
          git pull --rebase origin stage-010-8-authored-f16-audio
          git push origin HEAD:stage-010-8-authored-f16-audio

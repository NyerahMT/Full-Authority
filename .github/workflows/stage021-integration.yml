name: Stage 021 Malta Integration

on:
  push:
    branches:
      - stage021-malta-world
    paths:
      - 'scripts/apply-stage021-malta-integration.py'
      - '.github/workflows/stage021-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    name: Apply Stage 021 integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: stage021-malta-world
          fetch-depth: 0

      - name: Apply fail-fast patches
        run: |
          set -euo pipefail
          python3 scripts/apply-stage021-malta-integration.py

      - name: Verify generated and integrated files
        run: |
          set -euo pipefail
          test -s Assets/JSBSim/visuals/world/stage021_malta_world.bin
          test -s Simulation/Bridge/Stage021MaltaTerrain.inc
          grep -q 'Stage021MaltaWorld.make' App/PrototypeSceneView.swift
          grep -q 'FATerrainHeightMeters' Simulation/FlightSimulation.swift
          grep -q 'Stage021MaltaWorld.swift in Sources' FullAuthority.xcodeproj/project.pbxproj

      - name: Commit integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            App/PrototypeSceneView.swift \
            App/Stage021MaltaWorld.swift \
            App/Stage2WorldFactory.swift \
            Simulation/FlightSimulation.swift \
            Simulation/Bridge/FAJSBSimBridge.h \
            Simulation/Bridge/FAJSBSimBridge.mm \
            FullAuthority.xcodeproj/project.pbxproj
          if git diff --cached --quiet; then
            echo 'Integration already applied.'
            exit 0
          fi
          git commit -m 'Integrate Stage 021 Malta scenery'
          git push origin HEAD:stage021-malta-world

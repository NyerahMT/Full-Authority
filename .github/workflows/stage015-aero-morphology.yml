name: Stage015AeroMorphology

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage015-aero-morphology.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild aerodynamic vapor morphology
        run: |
          echo '' | base64 -d > /tmp/stage015.py
          python3 /tmp/stage015.py

      - name: Commit Stage 015
        run: |
          rm -f .github/workflows/stage015-aero-morphology.yml
          git config user.name "NyerahMT"
          git config user.email "68287092+NyerahMT@users.noreply.github.com"
          git add App/Stage2FlightEffects.swift .github/workflows/stage015-aero-morphology.yml
          git commit -m "Stage 015: realistic contrail and transonic vapor morphology"
          git push

name: One-shot canopy tangent segmentation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-canopy-tangent.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 scripts/one_shot_canopy_tangent.py

      - name: Commit to main
        run: |
          rm .github/workflows/one-shot-canopy-tangent.yml
          rm scripts/one_shot_canopy_tangent.py
          git config user.name NyerahMT
          git config user.email 68287092+NyerahMT@users.noreply.github.com
          git add -A
          git commit -m 'Stage 012.2: segment canopy by mesh tangent'
          git push origin main

name: Stage019AssetAudit

on:
  push:
    branches:
      - stage019-professional-visuals
    paths:
      - '.github/workflows/stage019-asset-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify Poly Haven CC0 material maps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fa-audit/polyhaven
          base='https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k'
          urls=(
            "$base/leafy_grass/leafy_grass_nor_gl_1k.jpg"
            "$base/asphalt_02/asphalt_02_nor_gl_1k.jpg"
            "$base/concrete_floor_01/concrete_floor_01_nor_gl_1k.jpg"
            "$base/forrest_ground_01/forrest_ground_01_diff_1k.jpg"
            "$base/forrest_ground_01/forrest_ground_01_rough_1k.jpg"
            "$base/forrest_ground_01/forrest_ground_01_nor_gl_1k.jpg"
          )
          for url in "${urls[@]}"; do
            file="/tmp/fa-audit/polyhaven/$(basename "$url")"
            curl --fail --location --silent --show-error "$url" --output "$file"
            test -s "$file"
            printf '%-42s %10s bytes\n' "$(basename "$file")" "$(stat -c%s "$file")"
          done

      - name: Download Kenney CC0 candidate packs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fa-audit/kenney
          curl --fail --location --silent --show-error \
            'https://opengameart.org/sites/default/files/Nature%20Kit%20%282.1%29.zip' \
            --output /tmp/fa-audit/kenney/nature.zip
          curl --fail --location --silent --show-error \
            'https://opengameart.org/sites/default/files/kenney_city-kit-industrial_2.0.zip' \
            --output /tmp/fa-audit/kenney/industrial.zip
          unzip -q /tmp/fa-audit/kenney/nature.zip -d /tmp/fa-audit/kenney/nature
          unzip -q /tmp/fa-audit/kenney/industrial.zip -d /tmp/fa-audit/kenney/industrial

      - name: Audit selected model scale and material structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roots = {
              'nature': Path('/tmp/fa-audit/kenney/nature/Models/OBJ format'),
              'industrial': Path('/tmp/fa-audit/kenney/industrial/Models/OBJ format'),
          }
          selected = {
              'nature': ['tree_default','tree_oak','tree_pineDefaultA','tree_pineTallA','rock_largeA'],
              'industrial': ['building-h','building-i','building-k','building-n','building-s','detail-tank','water-tower','shipping-container-a'],
          }

          for family, names in selected.items():
              print(f'--- {family} selected geometry ---')
              for name in names:
                  path = roots[family] / f'{name}.obj'
                  verts=[]; faces=0; materials=[]
                  for raw in path.read_text(errors='ignore').splitlines():
                      if raw.startswith('v '):
                          p=raw.split()
                          if len(p)>=4: verts.append(tuple(map(float,p[1:4])))
                      elif raw.startswith('f '):
                          faces += max(1, len(raw.split())-3)
                      elif raw.startswith('usemtl '):
                          m=raw.split(maxsplit=1)[1]
                          if m not in materials: materials.append(m)
                  mins=[min(v[i] for v in verts) for i in range(3)]
                  maxs=[max(v[i] for v in verts) for i in range(3)]
                  size=[maxs[i]-mins[i] for i in range(3)]
                  print(f'{name:22s} verts={len(verts):4d} tris~={faces:5d} size={size[0]:7.3f} x {size[1]:7.3f} x {size[2]:7.3f} usemtl={materials}')
                  mtl = roots[family] / f'{name}.mtl'
                  if mtl.exists():
                      print('  MTL:', ' | '.join(line.strip() for line in mtl.read_text(errors='ignore').splitlines() if line.strip()))
          PY

      - name: Preserve manifest and selected visual previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fa-audit/output/previews/industrial /tmp/fa-audit/output/previews/nature
          {
            echo '# Stage 019 CC0 asset audit'
            echo
            echo '## Nature OBJ files'
            find /tmp/fa-audit/kenney/nature -type f -iname '*.obj' -printf '%f\n' | sort
            echo
            echo '## Industrial OBJ files'
            find /tmp/fa-audit/kenney/industrial -type f -iname '*.obj' -printf '%f\n' | sort
          } > /tmp/fa-audit/output/manifest.txt

          for name in a d h i k n s; do
            cp "/tmp/fa-audit/kenney/industrial/Previews/building-$name.png" \
              "/tmp/fa-audit/output/previews/industrial/building-$name.png"
          done
          for name in tree_default tree_oak tree_pineDefaultA tree_pineTallA plant_bush rock_largeA; do
            preview=$(find /tmp/fa-audit/kenney/nature -type f -iname "${name}.png" | head -1 || true)
            if [ -n "$preview" ]; then
              cp "$preview" "/tmp/fa-audit/output/previews/nature/${name}.png"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: stage019-asset-audit
          path: /tmp/fa-audit/output
          retention-days: 7

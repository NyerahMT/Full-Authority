name: Stage015DepthPass

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/stage015-depth-pass.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Stage 015 terrain depth pass
        run: python3 Scripts/stage015_depth_pass.py

      - name: Commit Stage 015
        run: |
          rm -f .github/workflows/stage015-depth-pass.yml Scripts/stage015_depth_pass.py
          git config user.name "NyerahMT"
          git config user.email "68287092+NyerahMT@users.noreply.github.com"
          git add -A
          git commit -m "Stage 015: improve terrain depth perception"
          git push

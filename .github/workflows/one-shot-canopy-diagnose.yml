name: Canopy Boundary Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-canopy-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect forward canopy faces
        run: |
          python3 - <<'PY'
          import math
          from collections import defaultdict, deque
          from pathlib import Path

          lines=Path('Assets/JSBSim/visuals/f16/f16_static.obj').read_text().splitlines()
          V=[]; F=[]
          for line in lines:
              if line.startswith('v '): V.append(tuple(map(float,line.split()[1:4])))
              elif line.startswith('f '):
                  ids=[]
                  for tok in line.split()[1:]:
                      r=int(tok.split('/')[0]); ids.append(r-1 if r>0 else len(V)+r)
                  for j in range(1,len(ids)-1): F.append((ids[0],ids[j+1],ids[j]))
          def q(p): return tuple(round(x,4) for x in p)
          def sub(a,b): return tuple(a[i]-b[i] for i in range(3))
          def cross(a,b): return (a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0])
          def dot(a,b): return sum(a[i]*b[i] for i in range(3))
          def unit(a):
              n=math.sqrt(max(dot(a,a),1e-20)); return tuple(x/n for x in a)
          C=[]; N=[]; EF=defaultdict(list)
          for i,f in enumerate(F):
              a,b,c=[V[k] for k in f]
              C.append(tuple((a[j]+b[j]+c[j])/3 for j in range(3)))
              N.append(unit(cross(sub(b,a),sub(c,a))))
              for u,v in ((a,b),(b,c),(c,a)): EF[tuple(sorted((q(u),q(v))))].append(i)
          S=[i for i,p in enumerate(C) if abs(p[0])<.8 and 1.65<p[2]<4.55 and p[1]>.60]
          seed=max(S,key=lambda i:C[i][1]); sel={seed}; dq=deque([seed])
          while dq:
              i=dq.popleft(); ps=[V[k] for k in F[i]]
              for u,v in ((ps[0],ps[1]),(ps[1],ps[2]),(ps[2],ps[0])):
                  for n in EF[tuple(sorted((q(u),q(v))))]:
                      if n==i or n in sel: continue
                      p=C[n]
                      if not (abs(p[0])<1.18 and 1.35<p[2]<4.85 and p[1]>.34): continue
                      ang=math.degrees(math.acos(max(-1,min(1,dot(N[i],N[n])))))
                      lim=64 if (p[2]>3.0 and p[1]>.40 and abs(p[0])<.8) else 36
                      if ang<=lim: sel.add(n); dq.append(n)

          adj=defaultdict(set)
          for fs in EF.values():
              for a in fs:
                  for b in fs:
                      if a!=b: adj[a].add(b)

          wanted=[481,452,453,466,469,468,497,518,514,519,515,446,445,444,516,522]
          print('seed',seed,'selected count',len(sel))
          for i in wanted:
              print('\nFACE',i,'selected',i in sel,'centroid',tuple(round(x,4) for x in C[i]),'normal',tuple(round(x,4) for x in N[i]))
              print(' verts', [tuple(round(x,4) for x in V[k]) for k in F[i]])
              print(' neighbors',[(n,n in sel,tuple(round(x,4) for x in C[n]),round(math.degrees(math.acos(max(-1,min(1,dot(N[i],N[n]))))),2)) for n in sorted(adj[i])])

          print('\nFORWARD GRAPH faces z>4.55 y>0.15 absx<0.65')
          region=[i for i,p in enumerate(C) if p[2]>4.55 and p[1]>.15 and abs(p[0])<.65]
          for i in sorted(region,key=lambda i:(-C[i][2],-C[i][1],C[i][0])):
              near=[n for n in adj[i] if n in region]
              print(i,'SEL' if i in sel else 'OUT','C',tuple(round(x,3) for x in C[i]),'near',sorted(near))
          PY

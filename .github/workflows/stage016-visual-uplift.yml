name: Stage016VisualUplift

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/stage016-visual-uplift.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uplift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Import sourced assets and apply visual pass
        run: python3 Scripts/stage016_visual_uplift.py

      - name: Commit Stage 016
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage016-visual-uplift.yml Scripts/stage016_visual_uplift.py
          git config user.name "Full Authority Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Stage 016: sourced cinematic visual uplift"
          git push

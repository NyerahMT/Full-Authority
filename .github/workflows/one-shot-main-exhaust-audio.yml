name: One-shot main exhaust and audio overhaul

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-main-exhaust-audio.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch exhaust visuals and jet audio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          factory_path = Path('Aircraft/PrototypeAircraftFactory.swift')
          factory = factory_path.read_text()

          old_constants = '''    static let afterburnerInnerName = "FA.aircraft.afterburner.inner"\n    static let afterburnerOuterName = "FA.aircraft.afterburner.outer"\n    static let nozzleName = "FA.aircraft.nozzle"'''
          new_constants = '''    static let afterburnerInnerName = "FA.aircraft.afterburner.inner"\n    static let afterburnerOuterName = "FA.aircraft.afterburner.outer"\n    static let afterburnerCoreName = "FA.aircraft.afterburner.core"\n    static let afterburnerHaloName = "FA.aircraft.afterburner.halo"\n    static let afterburnerShockPrefix = "FA.aircraft.afterburner.shock."\n    static let nozzleName = "FA.aircraft.nozzle"'''
          if factory.count(old_constants) != 1:
              raise SystemExit('afterburner constant anchor mismatch')
          factory = factory.replace(old_constants, new_constants, 1)

          new_afterburner = r'''    private static func addAfterburner(to root: Entity) throws {
        let plumeMesh = try loadAuthoredOBJ("afterburner_plume")
        let plume = Entity()
        plume.name = afterburnerName

        // The authored airframe terminates at about z = -7.019 m. Everything
        // below is built from that physical nozzle lip so the flame cannot float
        // behind the aircraft or drift into the old R4 coordinate system.
        plume.position = [0, 0, -7.035]
        plume.isEnabled = false

        let aftRotation = simd_quatf(angle: -.pi / 2, axis: SIMD3<Float>(1, 0, 0))

        let halo = ModelEntity(
            mesh: plumeMesh,
            materials: [UnlitMaterial(color: UIColor(
                red: 0.18,
                green: 0.12,
                blue: 0.78,
                alpha: 0.15
            ))]
        )
        halo.name = afterburnerHaloName
        halo.orientation = aftRotation
        halo.scale = [1.12, 1.12, 1.30]
        plume.addChild(halo)

        let outer = ModelEntity(
            mesh: plumeMesh,
            materials: [UnlitMaterial(color: UIColor(
                red: 0.10,
                green: 0.30,
                blue: 1.0,
                alpha: 0.30
            ))]
        )
        outer.name = afterburnerOuterName
        outer.orientation = aftRotation
        outer.scale = [0.92, 0.98, 1.02]
        plume.addChild(outer)

        let inner = ModelEntity(
            mesh: plumeMesh,
            materials: [UnlitMaterial(color: UIColor(
                red: 0.44,
                green: 0.76,
                blue: 1.0,
                alpha: 0.52
            ))]
        )
        inner.name = afterburnerInnerName
        inner.orientation = aftRotation
        inner.scale = [0.56, 0.66, 0.72]
        plume.addChild(inner)

        let core = ModelEntity(
            mesh: plumeMesh,
            materials: [UnlitMaterial(color: UIColor(
                red: 0.90,
                green: 0.96,
                blue: 1.0,
                alpha: 0.82
            ))]
        )
        core.name = afterburnerCoreName
        core.orientation = aftRotation
        core.scale = [0.23, 0.30, 0.46]
        plume.addChild(core)

        // Shock cells are thin luminous pressure bands embedded inside the
        // envelope, not opaque spheres. Keeping them inside the plume prevents
        // the old detached "blob trail" look while still giving the burner the
        // alternating structure visible in real supersonic exhaust.
        let shockZ: [Float] = [-0.72, -1.43, -2.22, -3.10, -4.08]
        let shockR: [Float] = [0.35, 0.31, 0.27, 0.23, 0.19]
        for index in shockZ.indices {
            let cell = ModelEntity(
                mesh: .generateCylinder(height: 0.085, radius: shockR[index]),
                materials: [UnlitMaterial(color: UIColor(
                    red: 0.82,
                    green: 0.91,
                    blue: 1.0,

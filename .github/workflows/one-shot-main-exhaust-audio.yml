name: One-shot main exhaust and audio overhaul

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-main-exhaust-audio.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch exhaust visuals and jet audio
        run: python3 .github/patch_stage011.py

      - name: Commit Stage 011 directly to main
        run: |
          git config user.name "NyerahMT"
          git config user.email "68287092+NyerahMT@users.noreply.github.com"
          git rm .github/patch_stage011.py .github/workflows/one-shot-main-exhaust-audio.yml
          git add Aircraft/PrototypeAircraftFactory.swift App/PrototypeSceneView.swift
          git diff --cached --check
          git commit -m "Stage 011: overhaul F-16 exhaust and jet audio"
          git push origin HEAD:main

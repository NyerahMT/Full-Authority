name: iOS Device IPA

on:
  push:
    branches:
      - main
    paths:
      - 'App/**'
      - 'Simulation/**'
      - 'Aircraft/**'
      - 'World/**'
      - 'Assets/**'
      - 'scripts/**'
      - 'ThirdParty/**'
      - '.gitmodules'
      - 'FullAuthority.xcodeproj/**'
      - '.github/workflows/ios-device-ipa.yml'
  pull_request:
    paths:
      - 'App/**'
      - 'Simulation/**'
      - 'Aircraft/**'
      - 'World/**'
      - 'Assets/**'
      - 'scripts/**'
      - 'ThirdParty/**'
      - '.gitmodules'
      - 'FullAuthority.xcodeproj/**'
      - '.github/workflows/ios-device-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-authority-device-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  IOS_DEPLOYMENT_TARGET: '18.0'

jobs:
  ipa:
    name: Build unsigned iPhone IPA
    runs-on: macos-26

    steps:
      - name: Checkout Full Authority
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Show Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version

      - name: Build JSBSim for iPhoneOS
        run: |
          set -euo pipefail
          chmod +x scripts/build-jsbsim-ios.sh
          scripts/build-jsbsim-ios.sh iphoneos
          test -f Build/JSBSim/iphoneos/lib/libJSBSim.a
          lipo -info Build/JSBSim/iphoneos/lib/libJSBSim.a

      - name: Build for iPhoneOS
        run: |
          set -euo pipefail
          xcodebuild \
            -project FullAuthority.xcodeproj \
            -scheme FullAuthority \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/device" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Stage F-16 calibration data and mesh
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/device/Build/Products/Release-iphoneos/FullAuthority.app"
          chmod +x scripts/stage-f16-calibration.sh
          scripts/stage-f16-calibration.sh "$APP_PATH"
          test -s "$APP_PATH/JSBSim/aircraft/f16/f16.xml"
          test -s "$APP_PATH/JSBSim/aircraft/f16/Systems/hook.xml"
          test -s "$APP_PATH/JSBSim/engine/F100-PW-229.xml"
          test -s "$APP_PATH/JSBSim/engine/direct.xml"
          test -s "$APP_PATH/Models/f16.obj"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/device/Build/Products/Release-iphoneos/FullAuthority.app"
          test -d "$APP_PATH"

          rm -rf "$PWD/package"
          mkdir -p "$PWD/package/Payload"
          cp -R "$APP_PATH" "$PWD/package/Payload/"

          cd "$PWD/package"
          zip -qry "$GITHUB_WORKSPACE/FullAuthority-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/FullAuthority-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/FullAuthority-unsigned.ipa" | grep -E 'Payload/FullAuthority.app/(JSBSim/aircraft/f16/f16.xml|JSBSim/engine/F100-PW-229.xml|JSBSim/engine/direct.xml|Models/f16.obj|FullAuthority)' | head -20

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FullAuthority-unsigned-ipa
          path: FullAuthority-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

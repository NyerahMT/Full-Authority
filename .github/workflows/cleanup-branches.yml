name: Cleanup branches
on:
  push:
    branches: [stage024-real-reno-map]
    paths: ['.github/workflows/cleanup-branches.yml']
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage024-real-reno-map
          fetch-depth: 1
      - name: Delete stale remote branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | grep -v '^HEAD$' | sort -u)
          echo "Remote branches before cleanup: ${#branches[@]}"
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|stage024-real-reno-map)
                echo "KEEP   $branch"
                ;;
              *)
                echo "DELETE $branch"
                git push origin --delete "$branch"
                ;;
            esac
          done
          echo 'Remaining:'
          git ls-remote --heads origin

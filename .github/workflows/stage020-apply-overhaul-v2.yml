name: Stage020ApplyOverhaulV2

on:
  push:
    branches:
      - stage020-full-game-overhaul
    paths:
      - '.github/workflows/stage020-apply-overhaul-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage020-full-game-overhaul
          fetch-depth: 0

      - name: Import audited CC0 HDR sky
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Assets/JSBSim/visuals/world
          curl --fail --location --retry 3 \
            'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/farm_field_puresky_1k.exr' \
            -o Assets/JSBSim/visuals/world/stage020_farm_field_puresky_1k.exr
          test -s Assets/JSBSim/visuals/world/stage020_farm_field_puresky_1k.exr

      - name: Apply Stage 020 source changes
        run: |
          set -euo pipefail
          python3 scripts/stage020_apply.py

      - name: Commit complete Stage 020 source pass
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage020-apply-overhaul.yml
          rm -f .github/workflows/stage020-apply-overhaul-v2.yml
          rm -f scripts/stage020_apply.py
          git config user.name 'Full Authority Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Stage 020: full-game visual and yaw-control overhaul'
          git push origin HEAD:stage020-full-game-overhaul

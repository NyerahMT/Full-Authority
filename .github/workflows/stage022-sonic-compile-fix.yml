name: Stage022 Sonic Compile Fix
on:
  push:
    branches: [stage022-main-menu-attract-mode]
    paths: ['.github/workflows/stage022-sonic-compile-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage022-main-menu-attract-mode
      - run: python3 scripts/stage022_sonic_compile_fix.py
      - run: |
          set -euo pipefail
          grep -q 'let pressureMix: Float' App/Stage022MainMenu.swift
          git diff --check
      - run: |
          git config user.name 'NyerahMT'
          git config user.email '68287092+NyerahMT@users.noreply.github.com'
          git add App/Stage022MainMenu.swift
          git commit -m 'Stage 022: simplify sonic boom expression for Swift compiler'
          git push origin HEAD:stage022-main-menu-attract-mode

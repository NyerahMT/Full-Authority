name: Stage023 Terrain Finalize
on:
  push:
    branches: [stage023-terrain-system]
    paths: ['.github/workflows/stage023-terrain-finalize.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stage023-terrain-system
          submodules: false
      - run: python3 scripts/stage023_terrain_finalize.py
      - run: |
          set -euo pipefail
          grep -q 'let resolution = 121' App/Stage2WorldFactory.swift
          grep -q 'Same regular elevation grid' Simulation/Bridge/FAJSBSimBridge.mm
          grep -q 'let y: Float = 21' App/Stage022MainMenu.swift
          git diff --check
      - run: |
          git config user.name 'NyerahMT'
          git config user.email '68287092+NyerahMT@users.noreply.github.com'
          git add Simulation/Bridge/FAJSBSimBridge.mm App/Stage2WorldFactory.swift App/Stage022MainMenu.swift
          git commit -m 'Stage 023: lock terrain to shared 50m mesh and finish world pass'
          git push origin HEAD:stage023-terrain-system

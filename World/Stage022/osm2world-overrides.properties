# Full Authority Stage 022 overrides for OSM2World default style.
# The base style is pinned separately and remains the authoritative material/style set.

# Full Authority supplies its own real DEM so RealityKit and JSBSim share one ground surface.
createTerrain = false

# Billboard textures look wrong after the first mobile repack collapses textures to PBR color.
# Prefer OSM2World's actual low-poly geometry for vegetation and other eligible objects.
useBillboards = false

# Preserve tagged building colors/materials from OSM.
useBuildingColors = true

# Forest-generated trees are deliberately below desktop OSM2World density. Individually mapped
# trees and the full non-vegetation geometry remain data-driven; LOD4 still carries a dense canopy.
treesPerSquareMeter = 0.006

# The intermediate GLBs are build-only. Reference style textures instead of duplicating them into
# every zoom-15 tile; the repacker samples them into compact material colors.
staticResourceOutputMode = REFERENCE
generatedResourceOutputMode = STORE_SEPARATELY_AND_REFERENCE
maxTextureResolution = 128
textureQuality = 0.55
